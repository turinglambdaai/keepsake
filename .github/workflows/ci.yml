name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Racket engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Test engine
        run: raco test tests/
        shell: bash

  pages:
    name: Pages build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site files are present
        run: test -f site/index.html && test -f site/CNAME
