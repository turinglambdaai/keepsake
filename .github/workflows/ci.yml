name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the rivet pin; the release workflow pins the
# same tag so a bump is one edit per file, not a grep-replace across steps.
env:
  RIVET_PIN: v0.11.0

jobs:
  test:
    name: Racket engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Install websocket library
        run: raco pkg install --auto --no-docs websocket
        shell: bash
      # Standard package install pinned to rivet's released tag. Keel is a
      # declared dependency of rivet (>= 0.3.1) and resolves from the package
      # catalog — no source-tree linking anywhere.
      - name: Install Rivet
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Test engine
        run: raco test tests/
        shell: bash

  pages:
    name: Pages build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site files are present
        run: test -f site/index.html && test -f site/CNAME
